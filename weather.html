        const PROVIDERS = {
            cwa: { name: "中央氣象署 (CWA)", short: "CWA", color: "#38bdf8", defaultWeight: 0.40, desc: "台灣本土高解析測站，精準掌握地形雨與強降雨" },
            owm: { name: "OpenWeatherMap", short: "OWM", color: "#f59e0b", defaultWeight: 0.30, desc: "全球網格化即時氣象模型，短時氣溫與風速反應敏捷" },
            weatherapi: { name: "WeatherAPI.com", short: "WeatherAPI", color: "#10b981", defaultWeight: 0.15, desc: "提供詳細的體感溫度、濕度與紫外線指數量測" },
            tomorrow: { name: "Tomorrow.io", short: "Tomorrow", color: "#a855f7", defaultWeight: 0.15, desc: "高空間解析度人工智慧氣象演算雷達" }
        };

        // Pseudo-random deterministic noise based on seed string
        function pseudoRandom(seed) {
            let value = 0;
            for (let i = 0; i < seed.length; i++) {
                value += seed.charCodeAt(i) * (i + 1);
            }
            const x = Math.sin(value) * 10000;
            return x - Math.floor(x);
        }

        function generateMultiSourceData(city, districtObj, timeOffsetHours = 0) {
            const seedBase = `${city}-${districtObj.name}-${timeOffsetHours}`;
            const randBase = pseudoRandom(seedBase);
            
            let baseTemp = 24.5 + Math.sin(timeOffsetHours * 0.2) * 3.5;
            let basePop = Math.min(95, Math.max(5, Math.floor(randBase * 60 + (districtObj.microclimate.includes('rain') ? 25 : 0))));
            let baseHumidity = 70 + Math.floor(randBase * 20);
            let baseWind = 12 + Math.floor(randBase * 15);
            let baseUv = Math.max(0, Math.min(11, Math.floor((Math.sin((timeOffsetHours % 24 - 6) * 0.25) * 8) + randBase * 2)));

            if (districtObj.microclimate.includes('mountain')) baseTemp -= 3.2;
            if (districtObj.microclimate.includes('coastal') || districtObj.microclimate.includes('wind')) baseWind += 12;
            if (city === "基隆市" || city === "宜蘭縣") basePop = Math.min(98, basePop + 20);
            if (city === "高雄市" || city === "屏東縣") baseTemp += 2.1;

            return {
                cwa: {
                    temp: Number((baseTemp + (pseudoRandom(seedBase + 'cwa1') * 0.6 - 0.3)).toFixed(1)),
                    pop: Math.min(100, Math.max(0, Math.round(basePop + (pseudoRandom(seedBase + 'cwa2') * 6 - 3)))),
                    humidity: Math.min(100, Math.max(30, Math.round(baseHumidity + (pseudoRandom(seedBase + 'cwa3') * 4 - 2)))),
                    windSpeed: Number((baseWind + (pseudoRandom(seedBase + 'cwa4') * 3 - 1.5)).toFixed(1)),
                    uv: Math.max(0, Math.round(baseUv)),
                    condition: basePop > 60 ? "局部短暫陣雨" : basePop > 30 ? "多雲時晴" : "晴朗"
                },
                owm: {
                    temp: Number((baseTemp + (pseudoRandom(seedBase + 'owm1') * 1.4 - 0.7)).toFixed(1)),
                    pop: Math.min(100, Math.max(0, Math.round(basePop + (pseudoRandom(seedBase + 'owm2') * 12 - 6)))),
                    humidity: Math.min(100, Math.max(30, Math.round(baseHumidity + (pseudoRandom(seedBase + 'owm3') * 8 - 4)))),
                    windSpeed: Number((baseWind + (pseudoRandom(seedBase + 'owm4') * 5 - 2.5)).toFixed(1)),
                    uv: Math.max(0, Math.round(baseUv + (pseudoRandom(seedBase + 'owm5') > 0.5 ? 1 : 0))),
                    condition: basePop > 50 ? "陰短暫雨" : basePop > 25 ? "多雲" : "晴朗"
                },
                weatherapi: {
                    temp: Number((baseTemp + (pseudoRandom(seedBase + 'wa1') * 1.2 - 0.6)).toFixed(1)),
                    pop: Math.min(100, Math.max(0, Math.round(basePop + (pseudoRandom(seedBase + 'wa2') * 10 - 5)))),
                    humidity: Math.min(100, Math.max(30, Math.round(baseHumidity + (pseudoRandom(seedBase + 'wa3') * 6 - 3)))),
                    windSpeed: Number((baseWind + (pseudoRandom(seedBase + 'wa4') * 4 - 2)).toFixed(1)),
                    uv: Math.max(0, Math.round(baseUv)),
                    condition: basePop > 55 ? "陣雨" : basePop > 20 ? "多雲" : "晴"
                },
                tomorrow: {
                    temp: Number((baseTemp + (pseudoRandom(seedBase + 'tm1') * 1.0 - 0.5)).toFixed(1)),
                    pop: Math.min(100, Math.max(0, Math.round(basePop + (pseudoRandom(seedBase + 'tm2') * 8 - 4)))),
                    humidity: Math.min(100, Math.max(30, Math.round(baseHumidity + (pseudoRandom(seedBase + 'tm3') * 5 - 2.5)))),
                    windSpeed: Number((baseWind + (pseudoRandom(seedBase + 'tm4') * 3 - 1.5)).toFixed(1)),
                    uv: Math.max(0, Math.round(baseUv)),
                    condition: basePop > 60 ? "短暫陣雨" : basePop > 30 ? "多雲" : "晴"
                }
            };
        }

        function computeAggregatedWeather(sourcesData, weights, activeSources = { cwa: true, owm: true, weatherapi: true, tomorrow: true }) {
            let totalWeight = 0;
            let weightedTemp = 0;
            let weightedPop = 0;
            let weightedHumidity = 0;
            let weightedWind = 0;
            let weightedUv = 0;

            const temps = [];
            const pops = [];

            Object.keys(PROVIDERS).forEach(key => {
                // Skip inactive/disabled sources
                if (activeSources && !activeSources[key]) return;

                const w = weights[key] || 0;
                const src = sourcesData[key];
                if (src && w > 0) {
                    totalWeight += w;
                    weightedTemp += src.temp * w;
                    weightedPop += src.pop * w;
                    weightedHumidity += src.humidity * w;
                    weightedWind += src.windSpeed * w;
                    weightedUv += src.uv * w;

                    temps.push(src.temp);
                    pops.push(src.pop);
                }
            });

            if (totalWeight === 0) totalWeight = 1;

            const avgTemp = Number((weightedTemp / totalWeight).toFixed(1));
            const avgPop = Math.round(weightedPop / totalWeight);
            const avgHumidity = Math.round(weightedHumidity / totalWeight);
            const avgWind = Number((weightedWind / totalWeight).toFixed(1));
            const avgUv = Math.round(weightedUv / totalWeight);

            const tempMaxMinDiff = temps.length > 0 ? Math.max(...temps) - Math.min(...temps) : 0;
            const popMaxMinDiff = pops.length > 0 ? Math.max(...pops) - Math.min(...pops) : 0;

            let confidenceScore = 100;
            let agreementText = "高發高度一致 High Agreement";
            let agreementColor = "text-emerald-400 bg-emerald-500/10 border-emerald-500/30";
            let agreementBadge = "各模式極度收斂";

            if (tempMaxMinDiff > 2.5 || popMaxMinDiff > 35) {
                confidenceScore = 65;
                agreementText = "顯著分歧 Moderate Variance";
                agreementColor = "text-amber-400 bg-amber-500/10 border-amber-500/30";
                agreementBadge = "降雨/溫差預報分歧";
            } else if (tempMaxMinDiff > 1.2 || popMaxMinDiff > 20) {
                confidenceScore = 85;
                agreementText = "良好一致 Moderate Agreement";
                agreementColor = "text-cyan-400 bg-cyan-500/10 border-cyan-500/30";
                agreementBadge = "微幅差異趨勢一致";
            }

            const e = (avgHumidity / 100) * 6.105 * Math.exp((17.27 * avgTemp) / (237.7 + avgTemp));
            const feelsLike = Number((avgTemp + 0.33 * e - 0.70 * (avgWind / 3.6) - 4.00).toFixed(1));

            return {
                temperature: avgTemp,
                feelsLike: Math.max(avgTemp - 3, Math.min(avgTemp + 4, feelsLike)),
                pop: avgPop,
                humidity: avgHumidity,
                windSpeed: avgWind,
                uv: avgUv,
                confidenceScore,
                agreementText,
                agreementColor,
                agreementBadge,
                tempDiff: Number(tempMaxMinDiff.toFixed(1)),
                popDiff: popMaxMinDiff,
                condition: avgPop > 60 ? "陣雨預警" : avgPop > 30 ? "多雲陰天" : "晴朗舒適"
            };
        }

        function WeatherChart({ data, providers, activeSources }) {
            const [hoveredIdx, setHoveredIdx] = React.useState(null);
            const [visibleSources, setVisibleSources] = React.useState({
                avgTemp: true,
                cwaTemp: true,
                owmTemp: true,
                waTemp: true,
                tmTemp: true
            });

            if (!data || data.length === 0) return null;

            // Mapping provider keys to chart temperature keys
            const keyMapping = {
                cwa: 'cwaTemp',
                owm: 'owmTemp',
                weatherapi: 'waTemp',
                tomorrow: 'tmTemp'
            };

            // Calculate min & max temperatures across active sources
            let allTemps = [];
            data.forEach(d => {
                if (visibleSources.avgTemp) allTemps.push(d.avgTemp);
                if (activeSources.cwa && visibleSources.cwaTemp) allTemps.push(d.cwaTemp);
                if (activeSources.owm && visibleSources.owmTemp) allTemps.push(d.owmTemp);
                if (activeSources.weatherapi && visibleSources.waTemp) allTemps.push(d.waTemp);
                if (activeSources.tomorrow && visibleSources.tmTemp) allTemps.push(d.tmTemp);
            });

            if (allTemps.length === 0) allTemps = [20, 25];

            const minTemp = Math.floor(Math.min(...allTemps) - 1.5);
            const maxTemp = Math.ceil(Math.max(...allTemps) + 1.5);
            const tempRange = Math.max(1, maxTemp - minTemp);

            const width = 800;
            const height = 240;
            const paddingLeft = 45;
            const paddingRight = 20;
            const paddingTop = 25;
            const paddingBottom = 35;

            const chartW = width - paddingLeft - paddingRight;
            const chartH = height - paddingTop - paddingBottom;

            const getX = (index) => paddingLeft + (index / (data.length - 1)) * chartW;
            const getY = (val) => paddingTop + chartH - ((val - minTemp) / tempRange) * chartH;

            // Helper to build SVG curve paths
            const buildPath = (key) => {
                return data.map((d, i) => {
                    const x = getX(i);
                    const y = getY(d[key]);
                    return `${i === 0 ? 'M' : 'L'} ${x} ${y}`;
                }).join(' ');
            };

            const toggleSource = (key) => {
                setVisibleSources(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const lineConfigs = [
                { key: 'avgTemp', sourceKey: 'avg', label: '加權合成平均', color: '#38bdf8', strokeWidth: 3.5, dash: 'none' },
                { key: 'cwaTemp', sourceKey: 'cwa', label: '中央氣象署 CWA', color: '#0ea5e9', strokeWidth: 1.8, dash: '4 4' },
                { key: 'owmTemp', sourceKey: 'owm', label: 'OpenWeatherMap', color: '#f59e0b', strokeWidth: 1.8, dash: '4 4' },
                { key: 'waTemp', sourceKey: 'weatherapi', label: 'WeatherAPI', color: '#10b981', strokeWidth: 1.8, dash: '4 4' },
                { key: 'tmTemp', sourceKey: 'tomorrow', label: 'Tomorrow.io', color: '#a855f7', strokeWidth: 1.8, dash: '4 4' }
            ].filter(cfg => cfg.sourceKey === 'avg' || (activeSources && activeSources[cfg.sourceKey]));

            const activeHoverData = hoveredIdx !== null ? data[hoveredIdx] : null;

            return (
                <div className="w-full">
                    {/* Source Toggle Controls */}
                    <div className="flex flex-wrap items-center gap-2 mb-4">
                        {lineConfigs.map(cfg => (
                            <button
                                key={cfg.key}
                                onClick={() => toggleSource(cfg.key)}
                                className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium border transition ${
                                    visibleSources[cfg.key] 
                                        ? 'bg-slate-800 text-slate-100 border-slate-600' 
                                        : 'bg-slate-900/40 text-slate-500 border-slate-800/80 opacity-60'
                                }`}
                            >
                                <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: cfg.color }}></span>
                                <span>{cfg.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* Chart Container */}
                    <div className="relative w-full overflow-hidden">
                        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto text-xs font-mono">
                            {/* Grid Lines */}
                            {[0, 0.33, 0.66, 1].map((ratio, i) => {
                                const val = (minTemp + ratio * tempRange).toFixed(1);
                                const y = paddingTop + chartH - ratio * chartH;
                                return (
                                    <g key={i}>
                                        <line x1={paddingLeft} y1={y} x2={width - paddingRight} y2={y} stroke="#334155" strokeDasharray="3 3" opacity="0.6" />
                                        <text x={paddingLeft - 8} y={y + 4} textAnchor="end" fill="#94a3b8" fontSize="11">{val}°C</text>
                                    </g>
                                );
                            })}

                            {/* X-Axis Labels */}
                            {data.map((d, i) => {
                                const x = getX(i);
                                const showLabel = data.length > 12 ? (i % 3 === 0 || i === data.length - 1) : true;
                                return (
                                    <g key={i}>
                                        <line x1={x} y1={paddingTop} x2={x} y2={paddingTop + chartH} stroke="#334155" strokeDasharray="2 2" opacity="0.2" />
                                        {showLabel && (
                                            <text x={x} y={height - 8} textAnchor="middle" fill="#94a3b8" fontSize="10">{d.time}</text>
                                        )}
                                    </g>
                                );
                            })}

                            {/* Lines */}
                            {lineConfigs.map(cfg => visibleSources[cfg.key] && (
                                <path
                                    key={cfg.key}
                                    d={buildPath(cfg.key)}
                                    fill="none"
                                    stroke={cfg.color}
                                    strokeWidth={cfg.strokeWidth}
                                    strokeDasharray={cfg.dash}
                                    className="transition-all duration-300"
                                />
                            ))}

                            {/* Data Point Circles */}
                            {data.map((d, i) => {
                                const x = getX(i);
                                return (
                                    <g key={i} className="cursor-pointer" onMouseEnter={() => setHoveredIdx(i)} onMouseLeave={() => setHoveredIdx(null)}>
                                        <rect x={x - 20} y={paddingTop} width={40} height={chartH} fill="transparent" />
                                        {lineConfigs.map(cfg => visibleSources[cfg.key] && (
                                            <circle
                                                key={cfg.key}
                                                cx={x}
                                                cy={getY(d[cfg.key])}
                                                r={cfg.key === 'avgTemp' ? (hoveredIdx === i ? 6 : 4) : (hoveredIdx === i ? 4 : 2.5)}
                                                fill={cfg.color}
                                                stroke="#0f172a"
                                                strokeWidth="1.5"
                                            />
                                        ))}
                                    </g>
                                );
                            })}

                            {/* Hover Vertical Guide Line */}
                            {hoveredIdx !== null && (
                                <line
                                    x1={getX(hoveredIdx)}
                                    y1={paddingTop}
                                    x2={getX(hoveredIdx)}
                                    y2={paddingTop + chartH}
                                    stroke="#38bdf8"
                                    strokeWidth="1"
                                    strokeDasharray="3 3"
                                />
                            )}
                        </svg>

                        {/* Interactive Tooltip Card */}
                        {activeHoverData && (
                            <div className="mt-3 p-3 bg-slate-900/90 backdrop-blur-md rounded-2xl border border-slate-700 shadow-xl flex flex-wrap items-center justify-between gap-3 text-xs">
                                <div className="font-bold text-cyan-400 font-mono text-sm">
                                    時間: {activeHoverData.time}
                                </div>
                                <div className="flex flex-wrap items-center gap-3 font-mono">
                                    <div className="text-cyan-300 font-bold">加權合成: {activeHoverData.avgTemp}°C</div>
                                    {activeSources.cwa && <div className="text-sky-400">CWA: {activeHoverData.cwaTemp}°C</div>}
                                    {activeSources.owm && <div className="text-amber-400">OWM: {activeHoverData.owmTemp}°C</div>}
                                    {activeSources.weatherapi && <div className="text-emerald-400">WeatherAPI: {activeHoverData.waTemp}°C</div>}
                                    {activeSources.tomorrow && <div className="text-purple-400">Tomorrow: {activeHoverData.tmTemp}°C</div>}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            // Location State
            const [selectedCity, setSelectedCity] = React.useState("臺北市");
            const [selectedDistrict, setSelectedDistrict] = React.useState(TAIWAN_DISTRICTS["臺北市"][0]);
            const [isLocating, setIsLocating] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState("overview"); // overview, daily
            const [selectedDayIndex, setSelectedDayIndex] = React.useState(0); // 選擇預報日期 (0 = 今天)

            // Active Sources Toggle State
            const [activeSources, setActiveSources] = React.useState({
                cwa: true,
                owm: true,
                weatherapi: true,
                tomorrow: true
            });

            // Provider Weights State
            const [weights, setWeights] = React.useState({
                cwa: 0.40,
                owm: 0.30,
                weatherapi: 0.15,
                tomorrow: 0.15
            });

            const [showWeightModal, setShowWeightModal] = React.useState(false);

            // Re-trigger Lucide icons when DOM updates
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [selectedCity, selectedDistrict, activeTab, showWeightModal, activeSources, selectedDayIndex]);

            // Toggle single weather source on / off
            const toggleSourceActive = (key) => {
                const activeCount = Object.values(activeSources).filter(Boolean).length;
                if (activeSources[key] && activeCount <= 1) {
                    return; // Retain at least one active source
                }
                setActiveSources(prev => ({ ...prev, [key]: !prev[key] }));
            };

            // Handle District Change
            const handleCityChange = (e) => {
                const newCity = e.target.value;
                setSelectedCity(newCity);
                setSelectedDistrict(TAIWAN_DISTRICTS[newCity][0]);
            };

            const handleDistrictChange = (e) => {
                const distName = e.target.value;
                const distObj = TAIWAN_DISTRICTS[selectedCity].find(d => d.name === distName);
                if (distObj) setSelectedDistrict(distObj);
            };

            // Trigger Mock GPS Location
            const handleGPSLocation = () => {
                setIsLocating(true);
                setTimeout(() => {
                    const cities = Object.keys(TAIWAN_DISTRICTS);
                    const randomCity = cities[Math.floor(Math.random() * cities.length)];
                    const districts = TAIWAN_DISTRICTS[randomCity];
                    const randomDistrict = districts[Math.floor(Math.random() * districts.length)];

                    setSelectedCity(randomCity);
                    setSelectedDistrict(randomDistrict);
                    setIsLocating(false);
                }, 800);
            };

            // Calculate current weather metrics
            const currentRawSources = React.useMemo(() => {
                return generateMultiSourceData(selectedCity, selectedDistrict, 0);
            }, [selectedCity, selectedDistrict]);

            const aggregated = React.useMemo(() => {
                return computeAggregatedWeather(currentRawSources, weights, activeSources);
            }, [currentRawSources, weights, activeSources]);

            // Hourly trend data (Next 24 Hours in 1h steps)
            const hourlyData = React.useMemo(() => {
                const list = [];
                const now = new Date();
                for (let i = 0; i < 24; i++) {
                    const hourOffset = i;
                    const hTime = new Date(now.getTime() + hourOffset * 3600 * 1000);
                    const label = `${hTime.getHours().toString().padStart(2, '0')}:00`;
                    const raw = generateMultiSourceData(selectedCity, selectedDistrict, hourOffset);
                    const agg = computeAggregatedWeather(raw, weights, activeSources);
                    
                    list.push({
                        time: label,
                        avgTemp: agg.temperature,
                        cwaTemp: raw.cwa.temp,
                        owmTemp: raw.owm.temp,
                        waTemp: raw.weatherapi.temp,
                        tmTemp: raw.tomorrow.temp,
                        pop: agg.pop
                    });
                }
                return list;
            }, [selectedCity, selectedDistrict, weights, activeSources]);

            // 7-Day Forecast Data
            const dailyData = React.useMemo(() => {
                const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
                const list = [];
                const today = new Date();
                for (let i = 0; i < 7; i++) {
                    const d = new Date(today.getTime() + i * 24 * 3600 * 1000);
                    const dayLabel = i === 0 ? "今天" : days[d.getDay()];
                    const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
                    const raw = generateMultiSourceData(selectedCity, selectedDistrict, i * 24);
                    const agg = computeAggregatedWeather(raw, weights, activeSources);

                    list.push({
                        dayIndex: i,
                        day: dayLabel,
                        date: dateStr,
                        tempHigh: Math.round(agg.temperature + 2.5),
                        tempLow: Math.round(agg.temperature - 3.2),
                        pop: agg.pop,
                        condition: agg.condition,
                        humidity: agg.humidity
                    });
                }
                return list;
            }, [selectedCity, selectedDistrict, weights, activeSources]);

            // Selected Day 24-Hour Forecast Data (1h steps)
            const selectedDayHourlyData = React.useMemo(() => {
                const list = [];
                const now = new Date();
                const dayOffsetHours = selectedDayIndex * 24;
                for (let i = 0; i < 24; i++) {
                    const hourOffset = dayOffsetHours + i;
                    const hTime = new Date(now.getTime() + hourOffset * 3600 * 1000);
                    const label = `${hTime.getHours().toString().padStart(2, '0')}:00`;
                    const raw = generateMultiSourceData(selectedCity, selectedDistrict, hourOffset);
                    const agg = computeAggregatedWeather(raw, weights, activeSources);
                    
                    list.push({
                        time: label,
                        avgTemp: agg.temperature,
                        cwaTemp: raw.cwa.temp,
                        owmTemp: raw.owm.temp,
                        waTemp: raw.weatherapi.temp,
                        tmTemp: raw.tomorrow.temp,
                        pop: agg.pop,
                        humidity: agg.humidity,
                        windSpeed: agg.windSpeed,
                        uv: agg.uv,
                        condition: agg.condition
                    });
                }
                return list;
            }, [selectedCity, selectedDistrict, weights, activeSources, selectedDayIndex]);

            const getUvText = (uv) => {
                if (uv <= 2) return { label: "低量級 Low", color: "text-emerald-400" };
                if (uv <= 5) return { label: "中量級 Moderate", color: "text-yellow-400" };
                if (uv <= 7) return { label: "高量級 High", color: "text-orange-400" };
                if (uv <= 10) return { label: "甚高級 Very High", color: "text-red-400" };
                return { label: "極高級 Extreme", color: "text-purple-400" };
            };

            return (
                <div className="min-h-screen pb-12 px-3 sm:px-6 lg:px-8 max-w-7xl mx-auto">

                    <header className="py-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800/80 mb-6">
                        <div className="flex items-center space-x-3">
                            <div className="p-2.5 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-2xl shadow-lg shadow-cyan-500/20">
                                <i data-lucide="cloud-sun" className="w-7 h-7 text-white"></i>
                            </div>
                            <div>
                                <h1 className="text-xl sm:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-cyan-300">
                                    台灣鄉鎮多源氣象合成平台
                                </h1>
                                <p className="text-xs sm:text-sm text-slate-400 flex items-center gap-1.5 mt-0.5">
                                    <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                    整合 CWA / OpenWeatherMap / WeatherAPI / Tomorrow.io
                                </p>
                            </div>
                        </div>

                        {/* District Selector & GPS Button */}
                        <div className="flex flex-wrap items-center gap-2">

                                    onChange={handleCityChange}
                                    className="bg-transparent text-slate-200 text-sm font-medium px-3 py-1.5 focus:outline-none cursor-pointer"
                                >
                                    {Object.keys(TAIWAN_DISTRICTS).map(city => (
                                        <option key={city} value={city} className="bg-slate-900 text-slate-200">{city}</option>
                                    ))}
                                </select>
                                <span className="text-slate-600">/</span>
                                <select 
                                    value={selectedDistrict.name} 
                                    onChange={handleDistrictChange}
                                    className="bg-transparent text-cyan-400 font-semibold text-sm px-3 py-1.5 focus:outline-none cursor-pointer"
                                >
                                    {TAIWAN_DISTRICTS[selectedCity].map(dist => (
                                        <option key={dist.name} value={dist.name} className="bg-slate-900 text-slate-200">{dist.name}</option>
                                    ))}
                                </select>
                            </div>

                            <button 
                                onClick={handleGPSLocation}
                                disabled={isLocating}
                                className="flex items-center gap-1.5 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl border border-slate-700 transition active:scale-95"
                                title="GPS 自動定位鄉鎮區"
                            >
                                <i data-lucide="navigation" className={`w-3.5 h-3.5 text-cyan-400 ${isLocating ? 'animate-spin' : ''}`}></i>
                                <span>{isLocating ? '定位中...' : 'GPS定位'}</span>
                            </button>

                            <button 
                                onClick={() => setShowWeightModal(true)}
                                className="flex items-center gap-1.5 px-3.5 py-2 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 text-xs font-medium rounded-xl border border-cyan-500/30 transition shadow-sm"
                            >
                                <i data-lucide="sliders" className="w-3.5 h-3.5"></i>
                                <span>權重微調</span>
                            </button>
                        </div>
                    </header>

                    {/* Main Hero Card - Aggregated Result */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8">
                        <div className="lg:col-span-7 glass-card rounded-3xl p-6 sm:p-8 relative overflow-hidden border border-slate-700/50 shadow-2xl flex flex-col justify-between">
                            <div className="absolute -top-24 -right-24 w-72 h-72 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none bg-glow"></div>
                            
                            <div>
                                <div className="flex items-center justify-between flex-wrap gap-2">
                                    <div>
                                        <span className="text-xs font-semibold tracking-wider text-cyan-400 uppercase bg-cyan-500/10 border border-cyan-500/20 px-2.5 py-1 rounded-full">
                                            {selectedCity} • {selectedDistrict.name}
                                        </span>
                                        <span className="text-xs text-slate-400 ml-2">
                                            微氣候屬性: <span className="text-slate-300 font-mono">{selectedDistrict.microclimate}</span>
                                        </span>
                                    </div>

                                    <div className={`px-3 py-1 rounded-full text-xs font-medium border flex items-center gap-1.5 ${aggregated.agreementColor}`}>
                                        <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                                        <span>{aggregated.agreementText}</span>
                                    </div>
                                </div>

                                <div className="mt-6 flex items-baseline gap-4">
                                    <div className="text-6xl sm:text-7xl font-extrabold tracking-tight text-white font-mono">
                                        {aggregated.temperature}°<span className="text-3xl text-slate-400 font-normal">C</span>
                                    </div>
                                    <div className="flex flex-col">
                                        <span className="text-lg font-medium text-cyan-200">
                                            {aggregated.condition}
                                        </span>
                                        <span className="text-xs text-slate-400">
                                            體感溫度 ~{aggregated.feelsLike}°C
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-8 pt-6 border-t border-slate-800">
                                <div className="bg-slate-900/40 rounded-2xl p-3 border border-slate-800">
                                    <div className="text-xs text-slate-400 flex items-center gap-1">
                                        <i data-lucide="umbrella" className="w-3.5 h-3.5 text-blue-400"></i>
                                        合成降雨率
                                    </div>
                                    <div className="text-lg font-bold text-slate-100 mt-1 font-mono">{aggregated.pop}%</div>
                                </div>
                                <div className="bg-slate-900/40 rounded-2xl p-3 border border-slate-800">
                                    <div className="text-xs text-slate-400 flex items-center gap-1">
                                        <i data-lucide="droplets" className="w-3.5 h-3.5 text-cyan-400"></i>
                                        平均濕度
                                    </div>
                                    <div className="text-lg font-bold text-slate-100 mt-1 font-mono">{aggregated.humidity}%</div>
                                </div>
                                <div className="bg-slate-900/40 rounded-2xl p-3 border border-slate-800">
                                    <div className="text-xs text-slate-400 flex items-center gap-1">
                                        <i data-lucide="wind" className="w-3.5 h-3.5 text-teal-400"></i>
                                        預估風速
                                    </div>
                                    <div className="text-lg font-bold text-slate-100 mt-1 font-mono">{aggregated.windSpeed} <span className="text-xs font-normal">km/h</span></div>
                                </div>
                                <div className="bg-slate-900/40 rounded-2xl p-3 border border-slate-800">
                                    <div className="text-xs text-slate-400 flex items-center gap-1">
                                        <i data-lucide="sun" className="w-3.5 h-3.5 text-amber-400"></i>
                                        紫外指數
                                    </div>
                                    <div className="text-lg font-bold text-slate-100 mt-1 font-mono">{aggregated.uv} <span className="text-xs font-normal text-slate-400">/11</span></div>
                                </div>
                            </div>
                        </div>

                        {}
                        {/* Provider Breakdown Cards with Interactive Switches */}
                        <div className="lg:col-span-5 flex flex-col justify-between space-y-3">
                            <div className="flex items-center justify-between mb-1 px-1">
                                <h3 className="text-sm font-bold text-slate-300 flex items-center gap-2">
                                    <i data-lucide="layers" className="w-4 h-4 text-cyan-400"></i>
                                    四大氣象來源數據即時對比
                                </h3>
                                <span className="text-xs text-slate-500">來源最大溫差: {aggregated.tempDiff}°C</span>
                            </div>

                            {Object.keys(PROVIDERS).map(key => {
                                const provider = PROVIDERS[key];
                                const srcData = currentRawSources[key];
                                const currentWeightPct = Math.round(weights[key] * 100);
                                const isActive = activeSources[key];

                                return (
                                    <div 
                                        key={key} 
                                        className={`glass-card rounded-2xl p-3.5 border transition-all duration-300 ${
                                            isActive 
                                                ? 'border-slate-800 glass-card-hover' 
                                                : 'border-slate-800/40 bg-slate-900/30 opacity-60'
                                        }`}
                                    >
                                        <div className="flex items-center justify-between gap-3">
                                            {/* Provider Info */}
                                            <div className="flex items-center space-x-3">
                                                <div 
                                                    className="w-2.5 h-10 rounded-full transition-colors duration-300" 
                                                    style={{ backgroundColor: isActive ? provider.color : '#475569' }}
                                                ></div>
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className={`text-sm font-semibold ${isActive ? 'text-slate-200' : 'text-slate-500 line-through'}`}>
                                                            {provider.name}
                                                        </span>
                                                        <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded border ${
                                                            isActive 
                                                                ? 'bg-slate-800 text-slate-400 border-slate-700' 
                                                                : 'bg-slate-900/80 text-slate-600 border-slate-800'
                                                        }`}>
                                                            {isActive ? `權重 ${currentWeightPct}%` : '已停用'}
                                                        </span>
                                                    </div>
                                                    <div className="text-xs text-slate-400 mt-0.5">
                                                        {isActive ? srcData.condition : '不採計此來源'}
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Temperature & Metrics */}
                                            <div className="flex items-center space-x-3 text-right">
                                                <div className={isActive ? '' : 'opacity-40'}>
                                                    <div className="text-base font-bold font-mono text-slate-100">{srcData.temp}°C</div>
                                                    <div className="text-[11px] text-blue-400 font-mono">降雨 {srcData.pop}%</div>
                                                </div>
                                                <div className={`hidden sm:block text-xs text-slate-400 border-l border-slate-800 pl-3 ${isActive ? '' : 'opacity-40'}`}>
                                                    <div>濕度 {srcData.humidity}%</div>
                                                    <div>風速 {srcData.windSpeed}k/h</div>
                                                </div>

                                                {/* Switch Toggle Button */}
                                                <button
                                                    onClick={() => toggleSourceActive(key)}
                                                    title={isActive ? "關閉此氣象源" : "開啟此氣象源"}
                                                    className={`relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                                                        isActive ? 'bg-cyan-500' : 'bg-slate-700'
                                                    }`}
                                                >
                                                    <span
                                                        className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-md ring-0 transition duration-200 ease-in-out ${
                                                            isActive ? 'translate-x-5' : 'translate-x-0'
                                                        }`}
                                                    />
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Interactive Tabs for Hourly and 7-Day Forecast */}
                    <div className="glass-card rounded-3xl p-6 border border-slate-800 mb-8">
                        <div className="flex items-center justify-between border-b border-slate-800 pb-4 mb-6 flex-wrap gap-3">
                            <div className="flex items-center space-x-2 bg-slate-900/60 p-1 rounded-2xl border border-slate-800">
                                <button 
                                    onClick={() => setActiveTab("overview")}
                                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition ${activeTab === 'overview' ? 'bg-cyan-500 text-white shadow-lg shadow-cyan-500/20' : 'text-slate-400 hover:text-white'}`}
                                >
                                    24小時跨源趨勢
                                </button>
                                <button 
                                    onClick={() => setActiveTab("daily")}
                                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition ${activeTab === 'daily' ? 'bg-cyan-500 text-white shadow-lg shadow-cyan-500/20' : 'text-slate-400 hover:text-white'}`}
                                >
                                    一週氣象合成預報
                                </button>
                            </div>

                            <div className="text-xs text-slate-400 flex items-center gap-2">
                                <i data-lucide="info" className="w-3.5 h-3.5 text-cyan-400"></i>
                                <span>圖表已自動套用加權平均演算法</span>
                            </div>
                        </div>

                        {/* Tab 1: Custom SVG Multi-Source Chart */}
                        {activeTab === "overview" && (
                            <div>
                                <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">未來 24 小時氣溫走向與各源預測對比 (可點擊圖例開啟/關閉模式)</h4>
                                <WeatherChart data={hourlyData} providers={PROVIDERS} activeSources={activeSources} />
                            </div>
                        )}

                        {/* Tab 2: 7-Day Daily Forecast List & Expanded Hourly Detail */}
                        {activeTab === "daily" && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
                                    {dailyData.map((d, index) => {
                                        const isSelected = selectedDayIndex === index;
                                        return (
                                            <div 
                                                key={index} 
                                                onClick={() => setSelectedDayIndex(index)}
                                                className={`cursor-pointer rounded-2xl p-4 border transition-all duration-300 text-center flex flex-col justify-between relative ${
                                                    isSelected 
                                                        ? 'bg-gradient-to-b from-cyan-950/60 to-slate-900 border-cyan-400 shadow-lg shadow-cyan-500/20 ring-2 ring-cyan-500/40 -translate-y-1' 
                                                        : 'bg-slate-900/50 hover:bg-slate-800/60 border-slate-800/80 hover:border-slate-700'
                                                }`}
                                            >
                                                {isSelected && (
                                                    <span className="absolute -top-2.5 left-1/2 -translate-x-1/2 px-2 py-0.5 bg-cyan-500 text-[10px] font-bold text-slate-950 rounded-full shadow-sm">

                                                    <div className="text-sm font-mono font-bold text-slate-100">
                                                        {d.tempHigh}° <span className="text-slate-500 font-normal">/ {d.tempLow}°C</span>
                                                    </div>
                                                    <div className="text-[11px] text-blue-400 mt-1 font-mono flex items-center justify-center gap-1">
                                                        <i data-lucide="umbrella" className="w-3 h-3"></i>
                                                        {d.pop}%
                                                    </div>
                                                    <div className="mt-2 text-[10px] text-cyan-400/80 flex items-center justify-center gap-0.5 font-medium">
                                                        <span>展開逐時</span>
                                                        <i data-lucide={isSelected ? "chevron-up" : "chevron-down"} className="w-3 h-3"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Expanded Hourly Forecast Panel for Selected Day */}
                                <div className="bg-slate-900/80 rounded-2xl p-5 border border-cyan-500/30 shadow-xl relative overflow-hidden">
                                    <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-800 flex-wrap gap-2">
                                        <div className="flex items-center gap-2">
                                            <div className="p-2 bg-cyan-500/10 rounded-xl text-cyan-400">
                                                <i data-lucide="clock" className="w-5 h-5"></i>
                                            </div>
                                            <div>
                                                <h4 className="text-base font-bold text-slate-100 flex items-center gap-2">
                                                    <span>{dailyData[selectedDayIndex]?.date} ({dailyData[selectedDayIndex]?.day}) 逐時合成氣象預報</span>
                                                    <span className="text-xs font-normal text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-2.5 py-0.5 rounded-full">
                                                        {dailyData[selectedDayIndex]?.condition}
                                                    </span>
                                                </h4>
                                                <p className="text-xs text-slate-400 mt-0.5">點選上方任意日期可切換該日之每 1 小時多源氣象合成趨勢 (共 24 小時)</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Weather Chart for Selected Day */}
                                    <WeatherChart data={selectedDayHourlyData} providers={PROVIDERS} activeSources={activeSources} />

                                    {/* Hourly Details Quick Scrollable Cards */}
                                    <div className="flex gap-2.5 overflow-x-auto pb-2 mt-6 pt-4 border-t border-slate-800">
                                        {selectedDayHourlyData.map((item, idx) => (
                                            <div key={idx} className="bg-slate-950/60 rounded-xl p-2.5 text-center border border-slate-800/80 min-w-[85px] shrink-0 hover:border-cyan-500/50 transition">
                                                <div className="text-xs font-mono text-cyan-400 font-semibold">{item.time}</div>
                                                <div className="text-base font-bold text-slate-100 font-mono my-1">{item.avgTemp}°C</div>
                                                <div className="text-[11px] text-blue-400 flex items-center justify-center gap-1 font-mono">
                                                    <i data-lucide="umbrella" className="w-3 h-3"></i>
                                                    {item.pop}%
                                                </div>
                                                <div className="text-[10px] text-slate-400 mt-1 flex items-center justify-center gap-1 font-mono">
                                                    <i data-lucide="droplets" className="w-2.5 h-2.5 text-cyan-500"></i>
                                                    {item.humidity}%
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Detailed Weather Indices Row */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div className="glass-card rounded-2xl p-5 border border-slate-800">
                            <div className="flex items-center justify-between mb-3">
                                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">紫外線防護建議</span>
                                <i data-lucide="sun-medium" className="w-4 h-4 text-amber-400"></i>
                            </div>
                            <div className="text-xl font-bold text-slate-100 font-mono">
                                UV {aggregated.uv} <span className={`text-sm font-sans ${getUvText(aggregated.uv).color}`}>({getUvText(aggregated.uv).label})</span>
                            </div>
                            <p className="text-xs text-slate-400 mt-2 leading-relaxed">
                                {aggregated.uv >= 8 ? "高強度曝曬，建議出門配帶遮陽帽與防曬乳液。" : aggregated.uv >= 5 ? "中等強度，戶外活動宜注意遮陽。" : "輻射極低，適合戶外活動。"}
                            </p>
                        </div>

                        <div className="glass-card rounded-2xl p-5 border border-slate-800">
                            <div className="flex items-center justify-between mb-3">
                                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">氣候一致性評估</span>
                                <i data-lucide="activity" className="w-4 h-4 text-cyan-400"></i>
                            </div>
                            <div className="text-xl font-bold text-slate-100 font-mono">
                                {aggregated.confidenceScore}<span className="text-xs text-slate-500"> / 100</span>
                            </div>
                            <p className="text-xs text-slate-400 mt-2 leading-relaxed">
                                {aggregated.agreementBadge}。各大模式在該地區對溫濕度預估之標準差小於臨界值。
                            </p>
                        </div>

                        <div className="glass-card rounded-2xl p-5 border border-slate-800">
                            <div className="flex items-center justify-between mb-3">
                                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">鄉鎮風速與陣風</span>
                                <i data-lucide="wind" className="w-4 h-4 text-teal-400"></i>
                            </div>
                            <div className="text-xl font-bold text-slate-100 font-mono">
                                {aggregated.windSpeed} <span className="text-xs text-slate-400 font-normal">km/h</span>
                            </div>
                            <p className="text-xs text-slate-400 mt-2 leading-relaxed">
                                受局部地形 ({selectedDistrict.microclimate}) 影響，沿海與山谷地區請留意強陣風。
                            </p>
                        </div>
                    </div>

                    {/* Custom Weight Adjustment Modal */}
                    {showWeightModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                            <div className="glass-card bg-slate-900 border border-slate-700 rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl relative">
                                <div className="flex items-center justify-between mb-6 border-b border-slate-800 pb-4">
                                    <div className="flex items-center space-x-2">
                                        <i data-lucide="sliders" className="w-5 h-5 text-cyan-400"></i>
                                        <h3 className="text-lg font-bold text-slate-100">自訂氣象來源權重比例</h3>
                                    </div>
                                    <button 
                                        onClick={() => setShowWeightModal(false)}
                                        className="text-slate-400 hover:text-white p-1 rounded-lg"
                                    >
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <p className="text-xs text-slate-400 mb-6">
                                    您可以根據偏好調整不同氣象源對最終「平均氣溫/降雨率」的計算權重占比：
                                </p>

                                <div className="space-y-5">
                                    {Object.keys(PROVIDERS).map(key => {
                                        const p = PROVIDERS[key];
                                        return (
                                            <div key={key}>
                                                <div className="flex justify-between text-xs font-medium text-slate-200 mb-1.5">
                                                    <span>{p.name}</span>
                                                    <span className="font-mono text-cyan-400">{Math.round(weights[key] * 100)}%</span>
                                                </div>
                                                <input 
                                                    type="range" 
                                                    min="0" 
                                                    max="1" 
                                                    step="0.05"
                                                    value={weights[key]}
                                                    onChange={(e) => setWeights({ ...weights, [key]: parseFloat(e.target.value) })}
                                                    className="w-full accent-cyan-400 bg-slate-800 rounded-lg h-2 cursor-pointer"
                                                />
                                                <div className="text-[11px] text-slate-500 mt-1">{p.desc}</div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="mt-8 pt-4 border-t border-slate-800 flex justify-end">
                                    <button 
                                        onClick={() => setShowWeightModal(false)}
                                        className="px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-medium text-xs rounded-xl shadow-lg shadow-cyan-500/25 transition"
                                    >
                                        套用權重設定
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-12 text-center text-xs text-slate-500 border-t border-slate-800/60 pt-6">
                        <p>© 台灣鄉鎮細節多源氣象合成平台 • Taiwan Fine-Grained District Weather Aggregator</p>
                    </footer>
                </div>
            );
        }

        // Initialize App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
